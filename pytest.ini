# Root pytest config (P19-DEVOPS-CI-PIPELINE-REVIEW)
# Fixes CI collection error: tests/ is a package, so `from conftest import ...`
# in test_haversine.py / test_scoring_logic.py needs tests/ on sys.path.
[pytest]
testpaths = tests
pythonpath = tests apps/resilience-scorecard/src
addopts = -p no:cacheprovider -ra
