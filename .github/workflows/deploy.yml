# Provable Resilience Intelligence — Deploy Pipeline
# Deploys DAB to dev on develop merge, prod on main merge
# P19-DEVOPS-CI-PIPELINE-REVIEW: deploys are now GATED on the full CI suite
# (bundle validate dev+prod, ruff, pytest, branding, artifact manifest).

name: Deploy

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-dev:
    name: Deploy to Dev
    needs: ci
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1

      - name: Deploy bundle (dev)
        run: databricks bundle deploy --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy-prod:
    name: Deploy to Production
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # required for the release-tag push below
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1

      - name: Deploy bundle (prod)
        run: databricks bundle deploy --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Tag release
        run: |
          # Calendar-based auto-tag for traceability; milestone semver tags (v0.1.0) are manual.
          # See BRANCH-STRATEGY.md for tag conventions.
          VERSION=$(date +v%Y.%m.%d-${GITHUB_SHA::7})
          git tag $VERSION
          git push origin $VERSION
