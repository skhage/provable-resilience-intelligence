# Provable Resilience Intelligence — CI Pipeline
# Validates DAB config + runs lint/tests on every PR to develop or main
# Enhanced: pip caching, branding compliance, dual-target validate, concurrency
# P19-DEVOPS-CI-PIPELINE-REVIEW (session 24): reusable via workflow_call so deploy.yml
# gates on the same checks; root ruff.toml + pytest.ini; JUnit + SHA-256 artifact manifest.
# P21-DEVOPS-PIN-CLI-AND-FE-GATE (session 27): databricks/setup-cli pinned to v1.22.1 by
# commit SHA (supply-chain safe); frontend tsc + eslint gate added for the scorecard app.
# P26-DEVOPS-FE-BUILD-ARTIFACT (session 28): frontend job now runs vite build (which also
# generates routeTree.gen.ts before tsc), and publishes __dist__ as a CI artifact that
# backend/core.py serves. No lockfile is tracked, so npm install (not npm ci) is used.
# P35-DEVOPS-V4-FROZEN-WRITE-GUARD (session 35): dedicated fail-fast gate so v4 shadow-build
# code can only write *_v4_candidate objects, never PRI-DEMO-FREEZE-v3 FROZEN objects
# (DEC-PRI-V4-SHADOW-BUILD). Snapshot: tests/frozen_v3_objects.json.
# P39-DEVOPS-V4-CANDIDATE-CODE-COVERAGE (session 39): guard moved to its own job
# (`v4-freeze-guard`) so it can be set as a REQUIRED status check in branch protection.
# Writer coverage is advisory while PRI_V4_COVERAGE_STRICT != '1'. Flip the repo variable
# PRI_V4_COVERAGE_STRICT to 1 (Settings > Variables) once all writers are checked in; no code change.

name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Bundle Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1

      - name: Validate DAB (dev)
        run: databricks bundle validate --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Validate DAB (prod)
        run: databricks bundle validate --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('bundle/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install ruff pytest
          pip install -r bundle/requirements.txt

      - name: Lint (ruff)
        # Root ruff.toml: correctness rules, *.ipynb excluded (SQL/magic cells)
        run: ruff check --config ruff.toml apps/ bundle/pipeline/ tests/

      - name: Unit tests
        # pytest.ini puts tests/ + app src on sys.path; Spark-dependent tests auto-skip
        run: pytest -v --tb=short --junitxml=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/junit.xml

  v4-freeze-guard:
    # REQUIRED status check (branch protection on main + develop): "v4 Freeze Guard"
    name: v4 Freeze Guard
    runs-on: ubuntu-latest
    env:
      # '0' = writer coverage advisory (warnings), '1' = blocking. Frozen-write check is always blocking.
      PRI_V4_COVERAGE_STRICT: ${{ vars.PRI_V4_COVERAGE_STRICT || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: v4 freeze write guard + writer coverage (DEC-PRI-V4-SHADOW-BUILD)
        # Fails if any v4-scoped file writes to an object FROZEN in PRI-DEMO-FREEZE-v3,
        # or (strict mode) if any registered *_v4_candidate object lacks a versioned writer.
        run: |
          echo "PRI_V4_COVERAGE_STRICT=${PRI_V4_COVERAGE_STRICT}"
          pytest -v --tb=short -rw tests/test_v4_frozen_write_guard.py

  frontend:
    name: Frontend Build + Typecheck + Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/resilience-scorecard
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend manifest
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/resilience-scorecard/package.json not committed; tsc/eslint gate skipped (tracked as P27-APP-COMMIT-FE-MANIFEST)"
          fi

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        # package-lock.json is gitignored; switch to `npm ci` + npm cache once a lockfile is tracked
        run: npm install --no-audit --no-fund

      - name: Build (vite)
        if: steps.detect.outputs.present == 'true'
        # Also generates ui/routeTree.gen.ts, which tsc needs
        run: npm run build

      - name: Verify build output
        if: steps.detect.outputs.present == 'true'
        run: |
          test -f src/resilience_scorecard/__dist__/index.html || { echo "::error::vite build produced no __dist__/index.html"; exit 1; }
          echo "dist files: $(find src/resilience_scorecard/__dist__ -type f | wc -l)"

      - name: Typecheck (tsc)
        if: steps.detect.outputs.present == 'true'
        run: npx --no-install tsc --noEmit -p tsconfig.json

      - name: Lint (eslint)
        if: steps.detect.outputs.present == 'true'
        run: |
          if ls eslint.config.* .eslintrc* >/dev/null 2>&1; then
            npx --no-install eslint "src/**/*.{ts,tsx}" --max-warnings 0
          else
            echo "::warning::No eslint config committed in apps/resilience-scorecard; eslint gate skipped"
          fi

      - name: Upload frontend dist
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resilience-scorecard-dist-${{ github.sha }}
          path: apps/resilience-scorecard/src/resilience_scorecard/__dist__
          if-no-files-found: error
          retention-days: 14

  artifact-manifest:
    name: Artifact Checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SHA-256 manifest of tracked files
        run: |
          git ls-files -z | xargs -0 sha256sum > artifact-manifest.sha256
          echo "Tracked files: $(wc -l < artifact-manifest.sha256)"
          echo "Manifest digest: $(sha256sum artifact-manifest.sha256 | cut -d' ' -f1)"

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: artifact-manifest-${{ github.sha }}
          path: artifact-manifest.sha256

  branding-check:
    name: Branding Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for forbidden brand references
        run: |
          # CEO Directive: All assets must use "Lakelink Fiber", never "Lumen Technologies"
          # Allowlist (meta-docs/enforcers that explain the rule): .assistant_instructions.md,
          # BRAND-GUIDE.md, UX-DESIGN-SPEC.md, CONTRIBUTING.md, BRANCH-STRATEGY.md, design-system.md,
          # .github/ (this check itself) and tests/ (branding test fixtures).
          FORBIDDEN=$(grep -rn "Lumen Technologies\|Lumen Enterprise" \
            --include='*.py' --include='*.sql' --include='*.yml' --include='*.yaml' \
            --include='*.tsx' --include='*.ts' --include='*.json' --include='*.html' \
            --include='*.css' --include='*.md' \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=tests \
            . | grep -v -e '.assistant_instructions.md' \
                     -e 'BRAND-GUIDE.md' \
                     -e 'UX-DESIGN-SPEC.md' \
                     -e 'CONTRIBUTING.md' \
                     -e 'BRANCH-STRATEGY.md' \
                     -e 'design-system.md' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Branding violation — found forbidden references:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "✅ Branding compliance check passed"
