[project]
name = "resilience-scorecard"
version = "0.1.0"
description = "Lakelink Fiber Provable Resilience Intelligence — Scorecard & Action Queue"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "databricks-sdk>=0.118.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.apx]
app_name = "resilience-scorecard"

[tool.apx.ui.registries]
shadcn = "shadcn"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
